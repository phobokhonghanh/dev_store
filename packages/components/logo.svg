<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Animation cho con trỏ nhấp nháy */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* Thiết lập animation chung */
    .cursor {
      animation: blink 0.6s infinite; /* Tăng thời gian lên chút cho mượt */
    }

    /* Tạo độ trễ (delay) để nhấp nháy lần lượt */
    .c1 { animation-delay: 0s; }
    .c2 { animation-delay: 0.5s; }
    .c3 { animation-delay: 0.8s; }
    .c3 { animation-delay: 1.1s; }
  </style>

  <!-- Group chính căn giữa -->
  <g transform="translate(150, 150)">
    
    <!-- CHỮ p (Tròn trịa hơn) - Màu Cyan -->
    <!-- Thân thẳng -->
    <path d="M35 -50 L20 60" stroke="#10B981" stroke-width="16" stroke-linecap="round"/>
    <!-- Bụng cong mềm mại -->
    <path d="M0 -60 Q 150 -60 40 10 Q 20 20 25 20" fill="none" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CHỮ h (Tròn trịa hơn) - Màu Vàng -->
    <!-- Thân thẳng -->
    <path d="M120 -60 L110 60" stroke="#10B981" stroke-width="16" stroke-linecap="round"/>
    <!-- Móc cong mềm mại -->
    <path d="M120 -10 Q 165 -20 160 20 L 156 60" fill="none" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CHỮ ơ (CÁI BÁT) - Giữ nguyên như cũ -->
    <g transform="translate(220, 30)">
        <!-- Thân bát (nửa hình tròn dưới) -->
        <path d="M-30 -10 A 35 35 0 0 0 40 -10" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
        <!-- Miệng bát (đường ngang) -->
        <line x1="-30" y1="-10" x2="40" y2="-10" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
        
        <!-- Dấu râu của chữ ơ (Là làn khói bốc lên) -->
        <path d="M30 -25 Q 45 -45 40 -65" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
        <path d="M10 -25 Q 25 -45 20 -65" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- CON TRỎ (CURSOR) - Dấu nháy -->
    <!-- Hình chữ nhật đặc trưng của terminal -->
    <!-- <rect x="280" y="10" width="20" height="50" fill="#10B981" fill-opacity="0.7" class="cursor c1"/>
    <rect x="305" y="20" width="20" height="40" fill="#10B981" fill-opacity="0.6" class="cursor c2"/>
    <rect x="330" y="30" width="15" height="30" fill="#10B981" fill-opacity="0.5" class="cursor c3"/>
    <rect x="350" y="40" width="10" height="20" fill="#10B981" fill-opacity="0.4" class="cursor c4"/> -->
    <rect x="280" y="-20" width="40" height="90" fill="#10B981" fill-opacity="1" class="cursor c1"/>
    <rect x="280" y="-20" width="40" height="90" fill="#10B981" fill-opacity="0.8" class="cursor c2"/>
    <rect x="280" y="-20" width="40" height="90" fill="#10B981" fill-opacity="0.4" class="cursor c3"/>
    <rect x="280" y="-20" width="40" height="90" fill="#000000" fill-opacity="0.2" class="cursor c4"/>

  </g>
</svg>