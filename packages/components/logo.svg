<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <radialGradient id="blueIrisGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="30%" style="stop-color:#4fc3f7" />
      <stop offset="90%" style="stop-color:#0288d1" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="3" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g class="eye-container" transform="translate(160, 150)">
    <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
       <path d="M -75,-15 Q -100,-60 -120,-55" />
       <path d="M -55,-35 Q -80,-80 -105,-85" />
       <path d="M -30,-45 Q -45,-90 -70,-100" />
    </g>
    <path d="M -90,0 Q 0,-60 90,0 Q 0,60 -90,0 Z" fill="#ffffff" stroke="#333" stroke-width="3" filter="url(#softShadow)"/>
    
    <g class="pupil">
        <circle cx="0" cy="0" r="42" fill="url(#blueIrisGradient)" stroke="#01579b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="20" fill="#212121"/>
        <ellipse cx="18" cy="-15" rx="12" ry="8" fill="#ffffff" opacity="0.9" transform="rotate(-25)"/>
        <circle cx="-15" cy="20" r="5" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <g class="eye-container" transform="translate(440, 150)">
    <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
       <path d="M 75,-15 Q 100,-60 120,-55" />
       <path d="M 55,-35 Q 80,-80 105,-85" />
       <path d="M 30,-45 Q 45,-90 70,-100" />
    </g>
    <path d="M 90,0 Q 0,-60 -90,0 Q 0,60 90,0 Z" fill="#ffffff" stroke="#333" stroke-width="3" filter="url(#softShadow)"/>
    
    <g class="pupil">
        <circle cx="0" cy="0" r="42" fill="url(#blueIrisGradient)" stroke="#01579b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="20" fill="#212121"/>
        <ellipse cx="18" cy="-15" rx="12" ry="8" fill="#ffffff" opacity="0.9" transform="rotate(-25)"/>
        <circle cx="-15" cy="20" r="5" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>