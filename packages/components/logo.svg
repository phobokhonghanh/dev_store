<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Animation cho con trỏ nhấp nháy */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* Thiết lập animation chung */
    .cursor {
      animation: blink 1.2s infinite; /* Tăng thời gian lên chút cho mượt */
    }

    /* Tạo độ trễ (delay) để nhấp nháy lần lượt */
    .c1 { animation-delay: 0.2s; }
    .c2 { animation-delay: 0.4s; }
    .c3 { animation-delay: 0.6s; }
    .c3 { animation-delay: 0.8s; }
  </style>

  <!-- Group chính căn giữa -->
  <g transform="translate(80, 180)">
    
    <!-- Dấu nhắc lệnh (Prompt) màu xanh lá -->
    <path d="M0 0 L15 10 L0 20" stroke="#4FFFB0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-40, -50)"/>

    <!-- CHỮ p (Tròn trịa hơn) - Màu Cyan -->
    <!-- Thân thẳng -->
    <path d="M20 -60 L20 60" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
    <!-- Bụng cong mềm mại -->
    <path d="M20 -60 Q 130 -60 20 10 Q 20 20 20 30" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CHỮ h (Tròn trịa hơn) - Màu Vàng -->
    <!-- Thân thẳng -->
    <path d="M110 -60 L110 60" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
    <!-- Móc cong mềm mại -->
    <path d="M110 -10 Q 160 -10 160 25 L 160 60" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CHỮ ơ (CÁI BÁT) - Giữ nguyên như cũ -->
    <g transform="translate(230, 20)">
        <!-- Thân bát (nửa hình tròn dưới) -->
        <path d="M-30 -10 A 35 35 0 0 0 40 -10" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
        <!-- Miệng bát (đường ngang) -->
        <line x1="-30" y1="-10" x2="40" y2="-10" stroke="#2C3E50" stroke-width="8" stroke-linecap="round"/>
        
        <!-- Dấu râu của chữ ơ (Là làn khói bốc lên) -->
        <path d="M30 -25 Q 45 -45 40 -65" fill="none" stroke="#4FFFB0" stroke-width="6" stroke-linecap="round"/>
        <path d="M10 -25 Q 25 -45 20 -65" fill="none" stroke="#4FFFB0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- CON TRỎ (CURSOR) - Dấu nháy -->
    <!-- Hình chữ nhật đặc trưng của terminal -->
    <rect x="300" y="10" width="20" height="50" fill="#2C3E50" fill-opacity="0.7" class="cursor c1"/>
    <rect x="325" y="20" width="20" height="40" fill="#2C3E50" fill-opacity="0.6" class="cursor c2"/>
    <rect x="350" y="30" width="15" height="30" fill="#2C3E50" fill-opacity="0.5" class="cursor c3"/>
    <rect x="370" y="40" width="10" height="20" fill="#4FFFB0" fill-opacity="0.4" class="cursor c4"/>
  </g>
  
  <!-- Text nhỏ mô tả dưới (Slogan dạng code) -->
  <text x="350" y="260" font-family="monospace" font-size="16" fill="#4FFFB0" text-anchor="middle" letter-spacing="2" opacity="0.8">
   Data Engineering
  </text>

</svg>